name: Harklight release history verification
on:
  workflow_dispatch:
    inputs:
      proof_json:
        description: 'Optional sanitized JSON containing the manifest and three actual client results'
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'scripts/history-continuity/**'
      - '.github/workflows/harklight-history-verification.yml'

permissions:
  contents: read

jobs:
  server-inventory:
    if: github.event_name != 'workflow_dispatch' || inputs.proof_json == ''
    name: Preserve predecessor history on the exact Server build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ERL_FLAGS: '+S 2:2 +SDcpu 1 +SDio 1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict
      - name: Build exact candidate
        run: |
          dist="$RUNNER_TEMP/history-dist"
          scripts/build-package.sh "$dist"
          (cd "$dist" && sha256sum --check SHA256SUMS)
          tar -xzf "$dist"/harklight-server-*-linux-x86_64.tar.gz -C "$dist"
      - name: Rehearse stopped upgrade in a private network namespace
        shell: bash
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/history-dist"
          upstream=https://github.com/clickety-clacks/harklight-server/releases/download
          for version in 0.1.49 0.2.16; do
            mkdir "$packages/$version"
            (
              cd "$packages/$version"
              archive="harklight-server-$version-linux-x86_64.tar.gz"
              curl -fsSL --retry 3 -O "$upstream/v$version/$archive"
              curl -fsSL --retry 3 -O "$upstream/v$version/SHA256SUMS"
              sha256sum --check --ignore-missing SHA256SUMS
              tar -xzf "$archive" --strip-components=1
            )
          done
          candidate=("$packages"/harklight-server-*-linux-x86_64/)
          fixture="$RUNNER_TEMP/history-fixture"
          isolated() {
            sudo systemd-run --quiet --wait --pipe --collect --property=PrivateNetwork=yes \
              --property=MemoryMax=4G --property=MemorySwapMax=0 --uid="$(id -u)" \
              /usr/bin/env ERL_FLAGS="$ERL_FLAGS" "$GITHUB_WORKSPACE/scripts/history-continuity/fixture.sh" "$@"
          }
          isolated init "$fixture" "$packages/0.1.49"
          isolated upgrade "$fixture" "${candidate[0]}" "$packages/0.2.16"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-server-history-only
          path: ${{ runner.temp }}/history-fixture/results/*.json


  connected-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.proof_json != ''
    name: Validate the exact candidate's connected iPhone, iPad and Web results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify sanitized connected client evidence
        env:
          PROOF_JSON: ${{ inputs.proof_json }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' scripts/build-package.sh)
          printf '%s\n' "$PROOF_JSON" > "$RUNNER_TEMP/history-proof.json"
          python3 scripts/history-continuity/verify.py release-gate \
            "$RUNNER_TEMP/history-proof.json" "$version" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-connected-history-proof
          path: ${{ runner.temp }}/history-proof.json
          if-no-files-found: error
