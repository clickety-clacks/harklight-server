name: FORMAT31 synthetic conversion rehearsal

on:
  push:
    branches: [server/format31-rehearsal]

permissions:
  contents: read

jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A
            shape: '2400 100000 1300 300 400'
          - name: C
            shape: '50000 500000 1300 0 400'
          - name: L
            shape: '50000 900000 1300 0 400'
    env:
      ATTENTION_SERVER_ENABLE: '0'
      MIX_ENV: prod
      ERL_FLAGS: '+S 2:2 +SDcpu 1 +SDio 1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict
      - run: mix deps.get --only prod
      - run: mix compile
      - name: Build synthetic fixture and measure the published prior package
        env:
          SHAPE: ${{ matrix.shape }}
        run: |
          mkdir -p "$RUNNER_TEMP/measurements" "$RUNNER_TEMP/prior"
          results="$RUNNER_TEMP/measurements"
          git rev-parse HEAD HEAD^ >"$results/commits.txt"
          awk '/^(MemTotal|MemAvailable):/' /proc/meminfo >"$results/capacity.txt"
          df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print "disk_free_kib", $4 }' >>"$results/capacity.txt"
          probe="$GITHUB_WORKSPACE/scripts/format31-rehearsal.exs"
          echo "HARKLIGHT_PROBE=$probe" >>"$GITHUB_ENV"
          read -r -a args <<< "$SHAPE"
          timeout 20m mix run --no-compile "$probe" seed "$RUNNER_TEMP/seed" "${args[@]}" >"$results/seed.log" 2>&1
          archive=harklight-server-0.2.16-linux-x86_64.tar.gz
          (
            cd "$RUNNER_TEMP/prior"
            release=https://github.com/clickety-clacks/harklight-server/releases/download/v0.2.16
            curl --fail --silent --show-error --location --retry 3 --remote-name "$release/$archive"
            curl --fail --silent --show-error --location --retry 3 --remote-name "$release/SHA256SUMS"
            sha256sum --check --ignore-missing SHA256SUMS
            tar -zxf "$archive"
          ) >"$results/prior-package.log" 2>&1
          cp -a "$RUNNER_TEMP/seed" "$RUNNER_TEMP/baseline"
          export HARKLIGHT_FIXTURE="$RUNNER_TEMP/baseline" HARKLIGHT_PROBE="$probe"
          set +e
          timeout 20m "$RUNNER_TEMP/prior/harklight-server-0.2.16-linux-x86_64/bin/attention_server" eval \
            'System.argv(["measure", System.fetch_env!("HARKLIGHT_FIXTURE")]); Code.require_file(System.fetch_env!("HARKLIGHT_PROBE"))' \
            >"$results/baseline.log" 2>&1
          echo "exit=$?" >>"$results/baseline.log"
      - name: Measure FORMAT27, FORMAT29 and FORMAT30 conversion and FORMAT31 startup
        run: |
          results="$RUNNER_TEMP/measurements"
          rehearsal() {
            timeout 20m mix run --no-compile "$HARKLIGHT_PROBE" "$@"
          }
          failed=0
          for format in 30 29 27; do
            fixture="$RUNNER_TEMP/format$format"
            cp -a "$RUNNER_TEMP/seed" "$fixture"
            if [[ "$format" != 30 ]] && ! rehearsal variant "$fixture" "$format" >"$results/variant-$format.log" 2>&1; then
              failed=1
              rm -rf -- "$fixture"
              continue
            fi
            if ! rehearsal inspect "$fixture" >"$results/format-$format.log" 2>&1; then
              failed=1
              rm -rf -- "$fixture"
              continue
            fi
            tar -cf "$RUNNER_TEMP/backup.tar" -C "$fixture" .
            stat --printf='backup_bytes %s\n' "$RUNNER_TEMP/backup.tar" >>"$results/format-$format.log"
            if rehearsal convert "$fixture" >>"$results/format-$format.log" 2>&1; then
              if [[ "$format" == 30 ]]; then
                rehearsal measure "$fixture" >"$results/candidate.log" 2>&1 || failed=1
              fi
            else
              failed=1
            fi
            rm -rf -- "$fixture" "$RUNNER_TEMP/backup.tar"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format31-${{ matrix.name }}
          path: ${{ runner.temp }}/measurements/
