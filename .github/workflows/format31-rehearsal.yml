name: FORMAT31 guarded retained-data rehearsal

on:
  push:
    branches: [server/format31-retained-guard]

permissions:
  contents: read

jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATTENTION_SERVER_ENABLE: '0'
      MIX_ENV: prod
      ERL_FLAGS: '+S 2:2 +SDcpu 1 +SDio 1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict
      - run: mix deps.get --only prod
      - run: mix compile
      - name: Build synthetic fixture using the published snapshot writer
        env:
          SHAPE: '2400 100000 1300 300 400'
        run: |
          mkdir -p "$RUNNER_TEMP/measurements" "$RUNNER_TEMP/prior"
          results="$RUNNER_TEMP/measurements"
          git rev-parse HEAD HEAD^ >"$results/commits.txt"
          awk '/^(MemTotal|MemAvailable):/' /proc/meminfo >"$results/capacity.txt"
          df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print "disk_free_kib", $4 }' >>"$results/capacity.txt"
          probe="$GITHUB_WORKSPACE/scripts/format31-rehearsal.exs"
          echo "HARKLIGHT_PROBE=$probe" >>"$GITHUB_ENV"
          archive=harklight-server-0.2.16-linux-x86_64.tar.gz
          (
            cd "$RUNNER_TEMP/prior"
            release=https://github.com/clickety-clacks/harklight-server/releases/download/v0.2.16
            curl --fail --silent --show-error --location --retry 3 --remote-name "$release/$archive"
            curl --fail --silent --show-error --location --retry 3 --remote-name "$release/SHA256SUMS"
            sha256sum --check --ignore-missing SHA256SUMS
            tar -zxf "$archive"
          ) >"$results/prior-package.log" 2>&1
          prior="$RUNNER_TEMP/prior/harklight-server-0.2.16-linux-x86_64/bin/attention_server"
          export HARKLIGHT_SHAPE="$SHAPE" HARKLIGHT_FIXTURE="$RUNNER_TEMP/seed" HARKLIGHT_PROBE="$probe"
          timeout 20m "$prior" eval \
            'System.argv(["seed", System.fetch_env!("HARKLIGHT_FIXTURE") | String.split(System.fetch_env!("HARKLIGHT_SHAPE"))]); Code.require_file(System.fetch_env!("HARKLIGHT_PROBE"))' \
            >"$results/seed.log" 2>&1
          files="$RUNNER_TEMP/seed/relay.sqlite3.uploads"
          find "$files" -type f -print | wc -l > "$results/upload-files.txt"
          du -sk "$files" | cut -f1 > "$results/upload-kib.txt"
          test "$(cat "$results/upload-files.txt")" -ge 16
      - name: Check guard refusal at 2 GiB and packaged conversion at 4 GiB
        run: |
          results="$RUNNER_TEMP/measurements"
          candidate="$RUNNER_TEMP/candidate"
          mix release attention_server --path "$candidate" > "$results/candidate-build.log" 2>&1
          install -m 755 scripts/harklight "$candidate/bin/harklight"
          (
            cd "$RUNNER_TEMP/seed/relay.sqlite3.uploads"
            find . -type f -exec sha256sum {} + | sort
          ) > "$results/before-files.sha256"
          run_capped() {
            local limit="$1"
            shift
            sudo systemd-run --quiet --wait --pipe --collect \
              --property=MemoryMax="$limit" --property=MemorySwapMax=0 --property=PrivateNetwork=yes \
              --uid="$(id -u)" --working-directory="$GITHUB_WORKSPACE" \
              /usr/bin/env "PATH=$PATH" "ERL_FLAGS=$ERL_FLAGS" ATTENTION_SERVER_ENABLE=0 \
              /usr/bin/time -f 'maximum_rss_kib=%M' "$candidate/bin/harklight" "$@"
          }
          for format in 29 30; do
            cp -a "$RUNNER_TEMP/seed" "$RUNNER_TEMP/format$format"
            fixture="$RUNNER_TEMP/format$format"
            if [[ "$format" == 29 ]]; then
              mix run --no-compile "$HARKLIGHT_PROBE" variant "$fixture" 29
              source_release=v0.2.15
            else
              source_release=v0.2.16
            fi
            store="$fixture/relay.sqlite3"
            original="$(sha256sum "$store")"
            if run_capped 2G store convert-stopped "$store" --from-release "$source_release" > "$results/refusal-$format.log" 2>&1; then
              echo "The conversion unexpectedly passed under the 2 GiB cap."
              exit 1
            fi
            grep -F 'fit not established' "$results/refusal-$format.log"
            [[ "$(sha256sum "$store")" == "$original" ]]
            echo "pass: database SHA-256 unchanged" >> "$results/refusal-$format.log"
            run_capped 4G store convert-stopped "$store" --from-release "$source_release" > "$results/accepted-$format.log" 2>&1
            grep -F 'Converted stopped Harklight store to FORMAT31' "$results/accepted-$format.log"
            run_capped 4G store convert-stopped "$store" --from-release "$source_release" > "$results/retry-$format.log" 2>&1
            grep -F 'already uses FORMAT31' "$results/retry-$format.log"
            (
              cd "$fixture/relay.sqlite3.uploads"
              find . -type f -exec sha256sum {} + | sort
            ) > "$results/after-format-$format-files.sha256"
            diff -u "$results/before-files.sha256" "$results/after-format-$format-files.sha256"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format31-retained-guard
          path: ${{ runner.temp }}/measurements/
