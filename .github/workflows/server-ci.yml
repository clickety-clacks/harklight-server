name: Server CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict

      - run: mix deps.get
      - run: MIX_ENV=prod mix compile

      - name: Prepare scratch filesystem for storage exhaustion regression
        run: |
          root="$RUNNER_TEMP/harklight-scratch"
          mkdir -p "$root"
          sudo mount -t tmpfs -o size=64m,mode=1777 tmpfs "$root"
          echo "HARKLIGHT_SCRATCH_FS_ROOT=$root" >> "$GITHUB_ENV"

      - run: mix test

      - name: Test release workflow helper
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Remove scratch filesystem
        if: always()
        run: |
          root="$RUNNER_TEMP/harklight-scratch"
          if [ -d "$root" ]; then
            if mountpoint -q "$root"; then sudo umount "$root"; fi
            rm -rf "$root"
          fi

  selfhost-postgres-scripts:
    name: Self-host PostgreSQL scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL 16 programs
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/postgres ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi

      # Private cluster in mode-0700 scratch on loopback; synthetic data only.
      - name: Backup, restore and refusal self-test
        run: bash scripts/postgres/selftest.sh

      - name: Migration orchestration test (contract test double)
        run: bash scripts/postgres/migrate-test.sh

  postgres-schema:
    name: PostgreSQL schema
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise explicit migration and FORMAT32 destinations
        run: |
          cat priv/postgres/001_initial.sql priv/postgres/002_message_history.sql \
            test/attention_server/repository/postgres_schema_v1.sql \
            test/attention_server/repository/postgres_message_history.sql \
            priv/postgres/003_large_text.sql \
            priv/postgres/004_conversation_read_positions.sql \
            test/attention_server/repository/postgres_conversation_read_positions.sql \
            priv/postgres/005_shared_message_history.sql \
            test/attention_server/repository/postgres_shared_message_history.sql |
            docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d fixture -f -
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict
      - run: mix deps.get
      - name: Verify isolated PostgreSQL transactions
        env:
          HARKLIGHT_POSTGRES_TEST_URL: postgres://fixture:fixture-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/fixture
        run: ATTENTION_SERVER_ENABLE=0 mix test test/attention_server/repository/postgres_transaction_test.exs

  postgres-import-checkpoints:
    name: PostgreSQL import checkpoints
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: migration_fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U fixture -d migration_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
          --cpus 1 --memory 1g --memory-swap 1g
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict
      - run: mix deps.get
      - name: Apply schema to a fresh throwaway database
        run: |
          apply_schema() {
            cat priv/postgres/001_initial.sql priv/postgres/002_message_history.sql \
              priv/postgres/003_large_text.sql priv/postgres/004_conversation_read_positions.sql \
              priv/postgres/005_shared_message_history.sql |
              docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d "$1" -f -
          }
          apply_schema migration_fixture
          docker exec "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d postgres -c 'CREATE DATABASE migration_explicit_epoch'
          apply_schema migration_explicit_epoch
          docker exec "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d postgres -c 'CREATE DATABASE migration_implicit_roster'
          apply_schema migration_implicit_roster
          for fixture_db in migration_shared_history migration_large_text migration_upload_bytes migration_invalid_ack migration_implicit_1 migration_implicit_17 migration_reset_1 migration_reset_17; do
            docker exec "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d postgres -c "CREATE DATABASE $fixture_db"
            apply_schema "$fixture_db"
          done
          docker exec "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d postgres -c "CREATE ROLE fixture_migrator LOGIN PASSWORD 'synthetic-migrator-password'; CREATE ROLE fixture_runtime LOGIN PASSWORD 'synthetic-runtime-password'"
          for fixture_db in migration_schema_fresh migration_schema_partial migration_schema_foreign; do
            docker exec "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture -d postgres -c "CREATE DATABASE $fixture_db OWNER fixture_migrator"
          done
          cat priv/postgres/001_initial.sql | docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U fixture_migrator -d migration_schema_partial -f -
      - name: Exercise stopped-history staging and interrupted transactions
        env:
          HARKLIGHT_MIGRATION_TEST_URL: postgres://fixture:fixture-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/migration_fixture
          ATTENTION_SERVER_ENABLE: '0'
          ERL_FLAGS: '+S 2:2'
        run: mix test test/migration_import_session_test.exs test/migration_bundle_test.exs test/migration_material_identity_test.exs test/migration_large_text_source_test.exs test/migration_large_text_import_test.exs test/migration_recipient_state_test.exs test/migration_subscription_test.exs test/migration_entry_test.exs test/migration_prepare_schema_test.exs test/migration_shared_messages_test.exs
