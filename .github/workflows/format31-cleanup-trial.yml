name: FORMAT31 cleanup integration rehearsal

on:
  push:
    branches: [server/format31-cleanup-trial]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27.3.3'
          elixir-version: '1.19.5'
          version-type: strict

      - run: mix deps.get
      - run: MIX_ENV=prod mix compile

      - name: Prepare scratch filesystem for storage exhaustion regression
        run: |
          root="$RUNNER_TEMP/harklight-scratch"
          mkdir -p "$root"
          sudo mount -t tmpfs -o size=64m,mode=1777 tmpfs "$root"
          echo "HARKLIGHT_SCRATCH_FS_ROOT=$root" >> "$GITHUB_ENV"

      - run: mix test

      - name: Test release workflow helper
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Remove scratch filesystem
        if: always()
        run: |
          root="$RUNNER_TEMP/harklight-scratch"
          if [ -d "$root" ]; then
            if mountpoint -q "$root"; then sudo umount "$root"; fi
            rm -rf "$root"
          fi
