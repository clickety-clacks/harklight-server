name: Harklight release installation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       github.event.action == 'published' &&
       github.event.release.draft == false &&
       github.event.release.prerelease == false)
    runs-on: [self-hosted, linux, x64, harklight-release-install]
    steps:
      - name: Resolve one published stable release tuple
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          command -v python3 >/dev/null
          python3 - <<'PY'
          import atexit
          import json
          import os
          import re
          import shutil
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = "clickety-clacks/harklight-server"
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          api_url = urllib.parse.urlsplit(api)
          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit("release API token is unavailable")
          if api_url.scheme != "https" or not api_url.hostname or api_url.username or api_url.password:
              raise SystemExit("release API endpoint is invalid")
          if os.environ.get("GITHUB_REPOSITORY") != repository:
              raise SystemExit("workflow ran outside the Harklight server repository")

          tag = os.environ.get("GITHUB_REF_NAME", "")
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match or os.environ.get("GITHUB_REF_TYPE") != "tag":
              raise SystemExit("installation requires an exact stable vX.Y.Z tag ref")
          version = tag[1:]
          if os.environ.get("GITHUB_REF") != f"refs/tags/{tag}":
              raise SystemExit("workflow ref does not match the exact selected tag")

          workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "")
          expected_workflow_ref = (
              f"{repository}/.github/workflows/harklight-release-install.yml@refs/tags/{tag}"
          )
          if workflow_ref != expected_workflow_ref:
              raise SystemExit("installation workflow is not executing from the selected tag")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "harklight-release-install",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, response_headers, new_url):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def request_json(path):
              request = urllib.request.Request(f"{api}{path}", headers=headers)
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except (urllib.error.URLError, OSError, ValueError):
                  raise SystemExit("release metadata request failed") from None

          encoded_tag = urllib.parse.quote(tag, safe="")
          release = request_json(
              f"/repos/{repository}/releases/tags/{encoded_tag}"
          )
          if (
              release.get("tag_name") != tag
              or release.get("draft") is not False
              or release.get("prerelease") is not False
              or not release.get("published_at")
          ):
              raise SystemExit("selected tag has no published stable release")

          event_name = os.environ.get("GITHUB_EVENT_NAME")
          if event_name == "release":
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                  event = json.load(event_file)
              event_release = event.get("release") or {}
              if (
                  event.get("action") != "published"
                  or event_release.get("tag_name") != tag
                  or event_release.get("draft") is not False
                  or event_release.get("prerelease") is not False
              ):
                  raise SystemExit("release event is not the selected published stable tag")
          elif event_name != "workflow_dispatch":
              raise SystemExit("unsupported installation event")

          ref = request_json(f"/repos/{repository}/git/ref/tags/{encoded_tag}")
          obj = ref.get("object") or {}
          seen = set()
          for _ in range(16):
              sha = obj.get("sha", "").lower()
              if not re.fullmatch(r"[0-9a-f]{40}", sha) or sha in seen:
                  raise SystemExit("tag reference cannot be resolved to a commit")
              seen.add(sha)
              if obj.get("type") == "commit":
                  commit = sha
                  break
              if obj.get("type") != "tag":
                  raise SystemExit("tag reference does not resolve to a commit")
              annotated = request_json(f"/repos/{repository}/git/tags/{sha}")
              obj = annotated.get("object") or {}
          else:
              raise SystemExit("annotated tag chain is too deep")

          workflow_sha = os.environ.get("GITHUB_WORKFLOW_SHA", "").lower()
          event_sha = os.environ.get("GITHUB_SHA", "").lower()
          if event_sha != commit or workflow_sha != commit:
              raise SystemExit("workflow source or event commit differs from the selected tag")

          expected = {
              f"harklight-server-{version}-linux-x86_64.tar.gz",
              "SHA256SUMS",
              "SELF_HOST.md",
          }
          assets = request_json(
              f"/repos/{repository}/releases/{release['id']}/assets?per_page=100"
          )
          if not isinstance(assets, list):
              raise SystemExit("release asset listing is unavailable")
          selected = {}
          for asset in assets:
              name = asset.get("name")
              if name in expected:
                  if name in selected:
                      raise SystemExit(f"release contains duplicate required asset: {name}")
                  if asset.get("state") != "uploaded" or int(asset.get("size", 0)) <= 0:
                      raise SystemExit(f"required release asset is not complete: {name}")
                  selected[name] = asset
          if set(selected) != expected:
              raise SystemExit("selected release is missing a required Harklight asset")

          runner_temp = os.environ.get("RUNNER_TEMP")
          if not runner_temp or not os.path.isdir(runner_temp):
              raise SystemExit("runner temporary directory is unavailable")
          work_dir = tempfile.mkdtemp(prefix="harklight-release-", dir=runner_temp)
          os.chmod(work_dir, 0o700)
          preserve_work_dir = False

          def remove_failed_work_dir():
              if not preserve_work_dir:
                  shutil.rmtree(work_dir, ignore_errors=True)

          atexit.register(remove_failed_work_dir)

          def download(asset, destination):
              asset_id = asset.get("id")
              if not isinstance(asset_id, int) or asset_id <= 0:
                  raise SystemExit("release asset identity is invalid")
              request_headers = dict(headers)
              request_headers["Accept"] = "application/octet-stream"
              request = urllib.request.Request(
                  f"{api}/repos/{repository}/releases/assets/{asset_id}",
                  headers=request_headers,
              )
              try:
                  try:
                      response = opener.open(request, timeout=120)
                  except urllib.error.HTTPError as redirect:
                      if redirect.code != 302:
                          redirect.close()
                          raise SystemExit("release asset download failed") from None
                      location = redirect.headers.get("Location")
                      redirect.close()
                      if not location:
                          raise SystemExit("release asset redirect is unavailable")
                      parsed = urllib.parse.urlsplit(location)
                      if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                          raise SystemExit("release asset redirect is invalid")
                      # The signed download URL comes from GitHub's authenticated asset API.
                      # Follow it without forwarding the repository token.
                      request = urllib.request.Request(
                          location, headers={"User-Agent": "harklight-release-install"}
                      )
                      response = opener.open(request, timeout=120)
                  if response.getcode() != 200:
                      response.close()
                      raise SystemExit("release asset download failed")
                  with response:
                      with open(destination, "xb") as output:
                          shutil.copyfileobj(response, output)
              except (urllib.error.URLError, OSError, ValueError):
                  raise SystemExit("release asset download failed") from None
              if os.path.getsize(destination) != int(asset["size"]):
                  raise SystemExit(f"downloaded release asset size differs: {asset['name']}")
              os.chmod(destination, 0o600)

          for name in expected:
              download(selected[name], os.path.join(work_dir, name))

          archive_name = f"harklight-server-{version}-linux-x86_64.tar.gz"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"work_dir={work_dir}\n")
              outputs.write(f"tag={tag}\n")
              outputs.write(f"version={version}\n")
              outputs.write(f"source_commit={commit}\n")
              outputs.write(f"archive_name={archive_name}\n")
          preserve_work_dir = True
          PY

      - name: Verify package and install the selected tuple
        env:
          WORK_DIR: ${{ steps.resolve.outputs.work_dir }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          RELEASE_SOURCE_COMMIT: ${{ steps.resolve.outputs.source_commit }}
          RELEASE_ARCHIVE_NAME: ${{ steps.resolve.outputs.archive_name }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          command -v python3 >/dev/null
          command -v sha256sum >/dev/null
          command -v tar >/dev/null
          archive="$WORK_DIR/$RELEASE_ARCHIVE_NAME"
          sums="$WORK_DIR/SHA256SUMS"
          guide="$WORK_DIR/SELF_HOST.md"
          archive_sha256="$(python3 - "$archive" "$sums" "$RELEASE_ARCHIVE_NAME" <<'PY'
          import hashlib
          import re
          import sys

          archive, sums_path, archive_name = sys.argv[1:]
          found = []
          with open(sums_path, encoding="ascii") as sums:
              for line in sums:
                  match = re.fullmatch(r"([0-9a-f]{64})  (.+)\n?", line)
                  if match and match.group(2) == archive_name:
                      found.append(match.group(1))
          if len(found) != 1:
              raise SystemExit("SHA256SUMS must contain exactly one matching archive entry")
          digest = hashlib.sha256()
          with open(archive, "rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != found[0]:
              raise SystemExit("published package checksum verification failed")
          print(actual)
          PY
          )"
          expected_root="harklight-server-$RELEASE_VERSION-linux-x86_64"
          python3 - "$archive" "$expected_root" <<'PY'
          import pathlib
          import posixpath
          import sys
          import tarfile

          archive, expected_root = sys.argv[1:]
          with tarfile.open(archive, "r:gz") as package:
              members = package.getmembers()
              if not members:
                  raise SystemExit("published package is empty")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts:
                      raise SystemExit("published package contains an invalid path")
                  if path.parts[0] != expected_root:
                      raise SystemExit("published package root differs from its release version")
                  if member.issym() or member.islnk():
                      target = pathlib.PurePosixPath(member.linkname)
                      resolved = posixpath.normpath(
                          member.linkname
                          if member.islnk()
                          else posixpath.join(path.parent.as_posix(), member.linkname)
                      )
                      if target.is_absolute() or not (
                          resolved == expected_root
                          or resolved.startswith(expected_root + "/")
                      ):
                          raise SystemExit("published package contains an escaping link")
          PY
          extracted="$WORK_DIR/extracted"
          mkdir -m 700 "$extracted"
          tar --no-same-owner -xzf "$archive" -C "$extracted"
          package="$extracted/$expected_root"
          test -x "$package/bin/harklight-release-install"
          cmp -s "$package/SELF_HOST.md" "$guide" || {
            echo "package guide differs from the exact release guide asset" >&2
            exit 1
          }
          python3 - "$package/BUILD_INFO" "$RELEASE_VERSION" "$RELEASE_SOURCE_COMMIT" <<'PY'
          import sys

          path, expected_version, expected_commit = sys.argv[1:]
          values = {}
          with open(path, encoding="utf-8") as info:
              for line in info:
                  if "=" in line:
                      key, value = line.rstrip("\n").split("=", 1)
                      values[key] = value
          if values.get("version") != expected_version:
              raise SystemExit("BUILD_INFO version differs from the selected release")
          if values.get("source_commit", "").lower() != expected_commit.lower():
              raise SystemExit("BUILD_INFO source commit differs from the selected release")
          if values.get("source_status") != "":
              raise SystemExit("published package was built from a dirty source tree")
          PY
          HARKLIGHT_RELEASE_TAG="$RELEASE_TAG" \
          HARKLIGHT_SOURCE_COMMIT="$RELEASE_SOURCE_COMMIT" \
          HARKLIGHT_ARCHIVE_SHA256="$archive_sha256" \
          HARKLIGHT_ARCHIVE_PATH="$archive" \
          HARKLIGHT_CHECKSUMS_PATH="$sums" \
          HARKLIGHT_GUIDE_PATH="$guide" \
            "$package/bin/harklight-release-install"
